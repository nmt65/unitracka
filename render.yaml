services:
  - type: web
    name: unitracka-api
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: BOOTSTRAP_ADMIN
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CNP_PEPPER
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: EMAIL_VERIFICATION_MINUTES
        value: "10"
      - key: PASSKEY_RP_NAME
        value: UniTrack
      - key: PASSKEY_RP_ID
        value: unitrack.sbs
      - key: PASSKEY_ORIGIN
        value: https://unitrack.sbs
      - key: PASSKEY_CHALLENGE_MINUTES
        value: "5"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DOCUMENT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_ADVISOR_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "25000"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FORCE_IPV4
        value: "true"
