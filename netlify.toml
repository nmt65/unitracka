[build]
  command = "npm run build --prefix frontend"
  publish = "frontend/dist"

[build.environment]
  VITE_STATIC_MODE = "false"
  VITE_API_URL = "/api"
  VITE_BASE_PATH = "/"

[[redirects]]
  from = "/api/*"
  to = "https://unitrack-api-79l5.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
